name: dompetku_app
description: "Tally: offline-first personal finance app."


publish_to: "none"


version: 1.2.0+10


environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.17.1
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  lucide_icons_flutter: ^3.1.25
  crypto: ^3.0.7
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  home_widget: ^0.10.0
  flutter_slidable: ^4.0.3
  excel: ^4.0.6
  file_picker: ^13.2.0
  archive: ^3.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.4


flutter:
  uses-material-design: true

  # Ikon kategori Phosphor duotone (MIT, lihat assets/fonts/PHOSPHOR_LICENSE.txt).
  # Paket phosphor_flutter tidak lagi cocok dengan Flutter terbaru, jadi
  # fontnya disertakan langsung.
  fonts:
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/Phosphor-Duotone.ttf
